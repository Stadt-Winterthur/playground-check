stages:
  - quality
  - deploy

quality:
  stage: quality
  tags:
    - docker
    - linux
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
  script:
    - python -m pip install -e '.[django]'
    - python -m compileall -q src tests
    - python -m unittest discover -s tests -v

deploy_test:
  stage: deploy
  tags:
    - playground-deploy-linux
  image: docker:cli
  interruptible: false
  resource_group: spielplatzkontrolle-test
  variables:
    GIT_STRATEGY: fetch
    DEPLOY_DIR: "/srv/docker/spielplatzkontrolle"
    DOCKER_HOST: "unix:///var/run/docker.sock"
  before_script:
    - docker info >/dev/null
    - docker compose version
  script:
    - sh .gitlab/scripts/deploy-test.sh
  environment:
    name: test
    url: https://stadtplantest.winterthur.ch/stadtgruen/spielplatzkontrolle/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: on_success
