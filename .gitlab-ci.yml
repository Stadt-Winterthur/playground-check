stages:
  - quality
  - deploy

# ------------------------------------------------------------------
# Quality: Python-Tests und Syntaxprüfung
# ------------------------------------------------------------------

quality:
  stage: quality

  tags:
    - docker
    - linux

  image: python:3.12-slim

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/

  script:
    - python --version
    - python -m pip install -e '.[django]'
    - python -m compileall -q src tests
    - python -m unittest discover -s tests -v

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: on_success
    - when: never


# --------------------------------------------
# Deploy: Docker-Image bauen und bereitstellen
# --------------------------------------------

deploy_test:
  stage: deploy

  tags:
    - playground-deploy-linux

  image: docker:cli

  interruptible: false
  resource_group: spielplatzkontrolle-test

  variables:
    GIT_STRATEGY: fetch
    DEPLOY_DIR: "/srv/docker/spielplatzkontrolle"
    DOCKER_HOST: "unix:///var/run/docker.sock"

  before_script:
    - docker info > /dev/null
    - docker compose version
    - test -f "$DEPLOY_DIR/.env"
    - test -f "$DEPLOY_DIR/compose.autodeploy.yaml"

  script:
    - sh .gitlab/scripts/deploy-test.sh

  environment:
    name: test
    url: https://stadtplantest.winterthur.ch/stadtgruen/spielplatzkontrolle/

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      when: on_success
    - when: never
