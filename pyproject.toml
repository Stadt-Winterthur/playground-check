[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playground-check-python"
version = "2026.11"
description = "Python reimplementation of the City of Winterthur playground inspection web application"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Geoinformation Winterthur"}]
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
production = ["gunicorn==23.0.0"]
django = ["Django>=5.2,<6", "djangorestframework>=3.16,<4"]

[project.scripts]
playground-check = "playground_check.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
playground_check = ["static/**/*", "templates/*"]
