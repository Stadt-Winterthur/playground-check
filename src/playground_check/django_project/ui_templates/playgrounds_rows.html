<p class="muted" aria-live="polite">{{ count }} {% tr "angezeigte Spielplätze" %}</p><ul class="place-list">{% for row in rows %}<li><a class="place-link" href="{{ prefix }}/detail/?name={{ row.name|urlencode }}"><span><strong>{{ row.name }}</strong><span class="muted">{{ row.street_name }} {{ row.house_no }}</span></span>{% include "icon.html" with name="chevron-right" icon_class="place-chevron" %}</a></li>{% empty %}<li class="empty-state">{% tr "Keine Treffer." %}</li>{% endfor %}</ul>
