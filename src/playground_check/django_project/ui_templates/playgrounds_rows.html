<p class="muted" aria-live="polite">{{ count }} angezeigte Spielplätze</p><ul class="place-list">{% for row in rows %}<li><a class="place-link" href="{{ prefix }}/__ui/detail/?name={{ row.name|urlencode }}"><span><strong>{{ row.name }}</strong><span class="muted">{{ row.street_name }} {{ row.house_no }}</span></span><span class="place-chevron" aria-hidden="true">›</span></a></li>{% empty %}<li class="empty-state">Keine Treffer.</li>{% endfor %}</ul>
