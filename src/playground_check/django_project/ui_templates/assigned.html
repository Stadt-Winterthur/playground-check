<div class="page-heading"><p class="eyebrow">Spielplätze</p><h1>Spielplatz auswählen</h1><p>Wähle zuerst die Inspektionsart und suche danach den Spielplatz.</p></div>
<form class="filter-panel" method="get" action="{{ prefix }}/__ui/assigned/" role="search"><div class="field"><label for="inspectiontype">Inspektionsart</label><select id="inspectiontype" name="inspectiontype"><option value="">Alle / Spielgeräteübersicht</option><option value="Visuelle Inspektion" {% if inspection_type == 'Visuelle Inspektion' %}selected{% endif %}>Visuelle Inspektion</option><option value="Operative Inspektion" {% if inspection_type == 'Operative Inspektion' %}selected{% endif %}>Operative Inspektion</option><option value="Hauptinspektion" {% if inspection_type == 'Hauptinspektion' %}selected{% endif %}>Hauptinspektion</option></select></div>
<div class="field grow"><label for="q">Spielplatz suchen</label><input id="q" type="search" name="q" maxlength="120" value="{{ query }}" placeholder="Name des Spielplatzes" hx-get="{{ prefix }}/__ui/assigned/" hx-trigger="input changed delay:350ms, search" hx-target="#assigned" hx-include="closest form"></div><button type="submit" class="primary-button">Suchen</button></form>
<div id="assigned">{% include "assigned_rows.html" %}</div>
