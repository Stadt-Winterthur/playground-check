<div class="page-heading"><p class="eyebrow">{% tr "Mängel" %}</p><h1>{% tr "Mängelübersicht" %}</h1><p>{% tr "Offene und erledigte Mängel suchen, priorisieren und bearbeiten." %}</p></div>
<form class="filter-panel defect-filters playground-search" method="get" action="{{ prefix }}/defects/" role="search">
  <div class="field grow"><label for="defect-query">{% tr "Suche" %}</label><input id="defect-query" class="playground-search-input" type="search" name="q" maxlength="120" value="{{ query }}" placeholder="{% tr "Spielplatz, Gerät, Beschrieb, Zuständigkeit …" %}" hx-get="{{ prefix }}/defects/" hx-target="#defect-results" hx-include="closest form" hx-trigger="input changed delay:400ms, search" hx-replace-url="true"></div>
  <div class="field"><label for="defect-state">{% tr "Status" %}</label><select id="defect-state" name="state"><option value="open" {% if state == 'open' %}selected{% endif %}>{% tr "Offen" %}</option><option value="done" {% if state == 'done' %}selected{% endif %}>{% tr "Erledigt" %}</option><option value="all" {% if state == 'all' %}selected{% endif %}>{% tr "Alle" %}</option></select></div>
  <div class="field"><label for="defect-priority">{% tr "Dringlichkeit" %}</label><select id="defect-priority" name="priority"><option value="">{% tr "Alle" %}</option><option value="1" {% if priority == '1' %}selected{% endif %}>{% tr "A (sofort)" %}</option><option value="2" {% if priority == '2' %}selected{% endif %}>{% tr "B (in diesem Jahr)" %}</option><option value="3" {% if priority == '3' %}selected{% endif %}>{% tr "C (im Folgejahr beurteilen)" %}</option></select></div>
  <button type="submit" class="primary-button">{% tr "Filtern" %}</button>
</form>
<div id="defect-results" aria-live="polite">{% include "defects_results.html" %}</div>
