<div class="page-heading"><p class="eyebrow">Mängel</p><h1>Mängelübersicht</h1><p>Mängel suchen und nach Status filtern.</p></div><div class="context-actions"><a class="primary-button" href="{{ prefix }}/__ui/defect/edit/">Mangel erfassen</a></div>
<form class="filter-panel" method="get" action="{{ prefix }}/__ui/defects/" role="search"><div class="field grow"><label for="defect-query">Suche</label><input id="defect-query" type="search" name="q" maxlength="120" value="{{ query }}" placeholder="Spielplatz, Gerät oder Beschreibung" hx-get="{{ prefix }}/__ui/defects/" hx-target="#defect-results" hx-include="closest form" hx-trigger="input changed delay:400ms, search" hx-replace-url="true"></div><div class="field"><label for="defect-state">Status</label><select id="defect-state" name="state" onchange="this.form.requestSubmit()"><option value="open" {% if state == 'open' %}selected{% endif %}>Offen</option><option value="done" {% if state == 'done' %}selected{% endif %}>Erledigt</option><option value="all" {% if state == 'all' %}selected{% endif %}>Alle</option></select></div><button type="submit" class="primary-button">Filtern</button></form>
<div id="defect-results">{% include "defects_results.html" %}</div>
