<div class="page-heading"><p class="eyebrow">Mängel</p><h1>Mängelübersicht</h1><p>Offene und erledigte Mängel suchen, priorisieren und bearbeiten.</p></div>
<div class="context-actions"><a class="primary-button" href="{{ prefix }}/defect/edit/">Mangel erfassen</a></div>
<form class="filter-panel defect-filters" method="get" action="{{ prefix }}/defects/" role="search">
  <div class="field grow"><label for="defect-query">Suche</label><input id="defect-query" type="search" name="q" maxlength="120" value="{{ query }}" placeholder="Spielplatz, Gerät, Beschrieb, Zuständigkeit …" hx-get="{{ prefix }}/defects/" hx-target="#defect-results" hx-include="closest form" hx-trigger="input changed delay:400ms, search" hx-replace-url="true"></div>
  <div class="field"><label for="defect-state">Status</label><select id="defect-state" name="state"><option value="open" {% if state == 'open' %}selected{% endif %}>Offen</option><option value="done" {% if state == 'done' %}selected{% endif %}>Erledigt</option><option value="all" {% if state == 'all' %}selected{% endif %}>Alle</option></select></div>
  <div class="field"><label for="defect-priority">Dringlichkeit</label><select id="defect-priority" name="priority"><option value="">Alle</option><option value="1" {% if priority == '1' %}selected{% endif %}>A (sofort)</option><option value="2" {% if priority == '2' %}selected{% endif %}>B (in diesem Jahr)</option><option value="3" {% if priority == '3' %}selected{% endif %}>C (im Folgejahr beurteilen)</option></select></div>
  <button type="submit" class="primary-button">Filtern</button>
</form>
<div id="defect-results" aria-live="polite">{% include "defects_results.html" %}</div>
