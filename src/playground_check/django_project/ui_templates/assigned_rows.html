<ul class="place-list">{% for row in rows %}<li><a class="place-link" href="{{ prefix }}/__ui/detail/?name={{ row.name|urlencode }}&amp;inspectiontype={{ inspection_type|urlencode }}"><span class="place-main"><strong>{{ row.name }}</strong><span class="muted">Spielplatz öffnen</span></span><span class="place-chevron" aria-hidden="true">›</span></a><div class="status-list">{% if row.hasOpenDeviceDefects %}<span class="status warning">Offene Mängel</span>{% endif %}{% if row.inspectionSuspended %}<span class="status">Inspektion ausgesetzt</span>{% endif %}</div></li>{% empty %}<li class="empty-state">Keine Spielplätze gefunden.</li>{% endfor %}</ul>
