<a class="back-link" href="{{ prefix }}/detail/?name={{ playground.name|urlencode }}">{% tr "← Zurück zum Spielplatz" %}</a>
<h1>{% tr "Mangel erfassen" %}</h1><p><strong>{{ playground.name }}</strong> · {{ device.type.description|default:device.type.name }} {% tr "· Geräte-ID" %} {{ fid }}</p>
{% include "ui_error.html" with message=form_error %}
<form method="post" action="{{ prefix }}/defect/edit/" data-protect-changes data-form-error="{{ form_error|yesno:'true,false' }}">
<input type="hidden" name="playdeviceFid" value="{{ fid }}">
<p><label for="new-description">{% tr "Beschreibung" %}</label><textarea id="new-description" name="defectDescription" required maxlength="255" rows="4">{{ values.defectDescription }}</textarea></p>
<p><label for="new-priority">{% tr "Dringlichkeit" %}</label><select id="new-priority" name="priority"><option value="0">{% tr "Keine Angabe" %}</option><option value="1" {% if values.priority == '1' %}selected{% endif %}>{% tr "A (sofort)" %}</option><option value="2" {% if values.priority == '2' %}selected{% endif %}>{% tr "B (mittelfristig)" %}</option><option value="3" {% if values.priority == '3' %}selected{% endif %}>{% tr "C (im Folgejahr beurteilen)" %}</option></select></p>
<p><label for="new-body">{% tr "Zuständige Stelle" %}</label><select id="new-body" name="defectsResponsibleBodyId"><option value="-1">{% tr "Keine Angabe" %}</option><option value="1" {% if values.defectsResponsibleBodyId == '1' %}selected{% endif %}>{% tr "Revier" %}</option><option value="2" {% if values.defectsResponsibleBodyId == '2' %}selected{% endif %}>{% tr "Spielplatzverantwortlicher" %}</option><option value="3" {% if values.defectsResponsibleBodyId == '3' %}selected{% endif %}>{% tr "Projektleiter" %}</option></select></p>
<p><label for="new-person">{% tr "Zuständige Person" %}</label><select id="new-person" name="responsibleUserFid"><option value="-1">{% tr "Keine Person zugewiesen" %}</option>{% for person in users %}<option value="{{ person.fid }}" {% if person.fid|stringformat:'s' == values.responsibleUserFid %}selected{% endif %}>{{ person.first_name }} {{ person.last_name }}</option>{% endfor %}</select></p>
<p class="muted">{% tr "Bei Dringlichkeit B sind Stelle und Person erforderlich." %}</p><button type="submit">{% tr "Mangel speichern" %}</button></form>
