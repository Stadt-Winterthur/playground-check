{# Incremental results: insert individual TR and ARTICLE elements into the existing
   containers. HTMX unwraps template before processing out-of-band swaps. #}
{% for defect in rows %}
<template><tr hx-swap-oob="beforeend:#defect-table-body" class="{% if defect.assignment_overdue %}defect-critical{% endif %}">

        <td><span class="defect-chip">{% if defect.done_by %}Erledigt{% else %}Offen{% endif %}</span>{% if defect.assignment_overdue %}<span class="defect-chip danger">24 h überschritten</span>{% endif %}</td>
        <td><strong>{{ defect.playground_name|default:"Spielplatz unbekannt" }}</strong><span class="defect-secondary">{{ defect.playdevice_type|default:"Spielgerät" }} · TID {{ defect.tid }}</span></td>
        <td class="defect-wide">{{ defect.playdevice_fid|default:"–" }}</td>
        <td>{% if defect.priority == 1 %}A (sofort){% elif defect.priority == 2 %}B (mittelfristig){% elif defect.priority == 3 %}C (im Folgejahr beurteilen){% else %}–{% endif %}</td>
        <td class="defect-wide">{{ defect.date_creation|date:"d.m.Y"|default:"–" }}</td>
        <td class="defect-wide">{% if defect.open_days is not None %}{{ defect.open_days }} Tage{% else %}–{% endif %}</td>
        <td class="defect-table-person">{% if defect.responsible_body_id == 1 %}Revier{% elif defect.responsible_body_id == 2 %}Spielplatzverantwortlicher{% elif defect.responsible_body_id == 3 %}Projektleiter{% else %}–{% endif %}<span class="defect-secondary">{{ defect.responsible_user_name|default:"–" }}</span></td>
        <td class="defect-wide">{{ defect.description|default:"–" }}</td><td class="defect-wide">{{ defect.comment|default:"–" }}</td>
        <td><a class="defect-table-link" href="{{ prefix }}/__ui/defect/?tid={{ defect.tid|urlencode }}">Öffnen<span class="visually-hidden">: {{ defect.playground_name }}, {{ defect.playdevice_type }}</span></a></td>
      </tr></template>
<template><article hx-swap-oob="beforeend:#defect-mobile-list" class="defect-mobile-item{% if defect.assignment_overdue %} defect-critical{% endif %}" role="listitem">

      <div class="defect-mobile-top"><strong>{{ defect.playground_name|default:"Spielplatz unbekannt" }}</strong><span class="defect-chip">{% if defect.done_by %}Erledigt{% else %}Offen{% endif %}</span></div>
      <div class="defect-secondary">{{ defect.playdevice_type|default:"Spielgerät" }} · {% if defect.priority == 1 %}A (sofort){% elif defect.priority == 2 %}B (mittelfristig){% elif defect.priority == 3 %}C (im Folgejahr){% else %}Keine Dringlichkeit{% endif %} · TID {{ defect.tid }}</div>
      {% if defect.assignment_overdue %}<span class="defect-chip danger">24 h überschritten</span>{% endif %}
      <p class="defect-mobile-description">{{ defect.description|default:"Keine Beschreibung" }}</p>
      <div class="defect-mobile-bottom"><span>{% if defect.open_days is not None %}Offen seit {{ defect.open_days }} Tagen{% else %}{{ defect.date_creation|date:"d.m.Y"|default:"–" }}{% endif %}</span><a href="{{ prefix }}/__ui/defect/?tid={{ defect.tid|urlencode }}">Details <span aria-hidden="true">›</span></a></div>
    </article></template>
{% endfor %}
{% if has_next %}<div class="load-more" hx-get="{{ prefix }}/__ui/defects/?q={{ query|urlencode }}&amp;state={{ state|urlencode }}&amp;priority={{ priority|urlencode }}&amp;page={{ next }}&amp;append=1" hx-trigger="revealed" hx-swap="outerHTML"><a class="secondary-button" href="{{ prefix }}/__ui/defects/?q={{ query|urlencode }}&amp;state={{ state|urlencode }}&amp;priority={{ priority|urlencode }}&amp;page={{ next }}">Weitere Mängel anzeigen</a></div>{% endif %}
