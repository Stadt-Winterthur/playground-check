<h1>Anmeldung</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="{{ prefix }}/login/">
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token_value }}"><p><label>E-Mail <input type="email" name="email" autocomplete="username" required></label></p>
<p><label>Passwort <input type="password" name="password" autocomplete="current-password" required></label></p><button type="submit">Anmelden</button></form>
